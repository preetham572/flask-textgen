<!DOCTYPE html>
<html>
<head>
  <title>AI Text Generator</title>
  <style>
    body {
      background: linear-gradient(to right, #1e3a8a, #1e40af);
      font-family: Arial, sans-serif;
      color: #e2e8f0;
      text-align: center;
      padding: 40px;
    }
    textarea {
      width: 100%;
      max-width: 600px;
      padding: 15px;
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 15px;
    }
    button {
      padding: 10px 20px;
      background: #38bdf8;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      color: black;
    }
    .history {
      margin-top: 40px;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 10px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }
    .history-item {
      margin-bottom: 20px;
      text-align: left;
    }
    a {
      color: #facc15;
    }
    #spinner:before {
  content: "";
  display: inline-block;
  border: 6px solid #f3f3f3;
  border-top: 6px solid #38bdf8;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  animation: spin 1s linear infinite;
  margin-right: 10px;
  vertical-align: middle;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
  </style>
</head>
<body>
  <h1>Welcome, {{ current_user.username }} 👋</h1>
  <form method="POST">
    <textarea name="prompt" placeholder="Type your prompt here..." required></textarea><br>
    <button type="submit">Generate</button>
  </form>

  <div class="history">
    <h2>Your History</h2>
    {% for item in history %}
      <div class="history-item">
        <strong>Prompt:</strong> {{ item.prompt }}<br>
        <strong>Response:</strong> {{ item.response }}
      </div>
    {% endfor %}
  </div>

  <br>
  <a href="{{ url_for('logout') }}">Logout</a>
  <script>
    const form = document.querySelector("form");
    form.addEventListener("submit", () => {
      const spinner = document.createElement("div");
      spinner.id = "spinner";
      spinner.innerHTML = `
        <div style="margin-top:20px; font-weight:bold;">⏳ Generating your response...</div>
      `;
      document.body.appendChild(spinner);
    });
  </script>
</body>
</html>
