<!DOCTYPE html>
<html>
<head>
  <title>AI Text Generator</title>
  <style>
    body {
      background: #0f172a;
      font-family: Arial, sans-serif;
      color: #e2e8f0;
      margin: 0;
      padding: 0;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    .left, .right {
      padding: 30px;
    }

    .left {
      flex: 2;
    }

    .right {
      flex: 1;
      background: #1e293b;
      overflow-y: auto;
    }

    textarea {
      width: 100%;
      padding: 15px;
      font-size: 1rem;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 20px;
      background: #38bdf8;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      color: black;
    }

    .current-response {
      margin-top: 20px;
      background: #1e40af;
      padding: 20px;
      border-radius: 10px;
      white-space: pre-line;
    }

    .history-title {
      font-weight: bold;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .history-item {
      margin-bottom: 20px;
      background: #334155;
      padding: 10px;
      border-radius: 8px;
    }

    .prompt-label {
      font-weight: bold;
      color: #94a3b8;
    }

    .logout-link {
      color: #facc15;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- LEFT SIDE -->
    <div class="left">
      <h2>Welcome, {{ current_user.username }}</h2>

      <form method="POST">
        <textarea name="prompt" placeholder="Type your prompt here..." required></textarea><br>
        <button type="submit">Generate</button>
      </form>

      {% if history and history[-1] %}
        <div class="current-response">
          <h3>🧠 AI Response:</h3>
          <p>{{ history[-1].response }}</p>
        </div>
      {% endif %}

      <a class="logout-link" href="{{ url_for('logout') }}">🚪 Logout</a>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
      <div class="history-title">📜 Previous History</div>
      {% for item in history[:-1] %}
        <div class="history-item">
          <div class="prompt-label">Prompt:</div>
          <div>{{ item.prompt }}</div>
          <div class="prompt-label" style="margin-top:10px;">Response:</div>
          <div>{{ item.response }}</div>
        </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
