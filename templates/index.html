<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Text Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #0f172a, #1e293b);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex: 1;
      padding: 20px;
      gap: 20px;
      flex-wrap: wrap;
    }

    .left {
      flex: 2;
      min-width: 300px;
    }

    .right {
      flex: 1;
      min-width: 250px;
      background: rgba(30, 41, 59, 0.7);
      border-radius: 10px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    h2 {
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 15px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      margin-top: 10px;
      margin-bottom: 15px;
      resize: vertical;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s ease;
      margin: 5px 5px 15px 0;
    }

    .btn-generate { background: #38bdf8; color: black; }
    .btn-generate:hover { background: #0ea5e9; }

    .btn-copy { background: #4ade80; color: black; }
    .btn-copy:hover { background: #22c55e; }

    .btn-clear { background: #ef4444; color: white; }
    .btn-clear:hover { background: #dc2626; }

    .btn-logout {
      background: transparent;
      color: #facc15;
      border: 1px solid #facc15;
    }

    .btn-logout:hover {
      background: #facc15;
      color: #000;
    }

    .current-response {
      margin-top: 20px;
      background: rgba(30, 64, 175, 0.6);
      padding: 20px;
      border-radius: 10px;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
    }

    .history-title {
      font-weight: bold;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .history-item {
      background: #334155;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .label {
      font-weight: bold;
      color: #94a3b8;
      margin-top: 10px;
    }

    @media screen and (max-width: 768px) {
      .container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- LEFT -->
    <div class="left">
      <h2>Welcome, {{ current_user.username }} 👋</h2>
      <form method="POST">
        <textarea name="prompt" placeholder="Ask me anything..." required></textarea>
        <button type="submit" class="btn btn-generate">⚡ Generate</button>
      </form>

      {% if history and history[-1] %}
        <div class="current-response">
          <h3>💬 Latest AI Response</h3>
          <p id="current-response-text">{{ history[-1].response }}</p>
          <button class="btn btn-copy" onclick="copyText(document.getElementById('current-response-text').innerText)">📋 Copy</button>
        </div>
      {% endif %}

      <form method="POST" action="{{ url_for('clear_history') }}">
        <button type="submit" class="btn btn-clear">🧹 Clear History</button>
      </form>
      <a href="{{ url_for('logout') }}">
        <button class="btn btn-logout">🚪 Logout</button>
      </a>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="history-title">📜 Previous Responses</div>
      {% for item in history[:-1] %}
        <div class="history-item">
          <div class="label">Prompt:</div>
          <div>{{ item.prompt }}</div>
          <div class="label">Response:</div>
          <div id="history-response-{{ loop.index }}">{{ item.response }}</div>
          <button class="btn btn-copy" onclick="copyText(document.getElementById('history-response-{{ loop.index }}').innerText)">📋 Copy</button>
        </div>
      {% endfor %}
    </div>
  </div>

  <script>
    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert("📋 Copied to clipboard!");
      });
    }
  </script>

</body>
</html>
