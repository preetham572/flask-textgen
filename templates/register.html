<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <style>
    body {
      background: #1e293b;
      font-family: Arial, sans-serif;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px;
    }
    form {
      background: #334155;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4ade80;
      border: none;
      color: black;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    a {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <h1>Register</h1>
  <form method="POST">
    <input type="text" name="username" placeholder="Choose a username" required />
    <input type="password" name="password" placeholder="Choose a password" required />
    <button type="submit">Sign Up</button>
    <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
  </form>
</body>
</html>
